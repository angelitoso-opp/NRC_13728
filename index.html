<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login con Clave Estática</title>
    <link rel="stylesheet" href="css/login.css">
</head>
<body>

    <section class="login-container">
        
        <div class="login-box">
            <div class="login-header">
                <img src="https://cdn-icons-png.flaticon.com/512/3143/3143615.png" alt="Icono ACME" class="login-icon" width="50" height="50">
                <h2>Acceso ACME</h2>
            </div>

            <form onsubmit="return validarLogin(event);">

                <div class="input-group">
                    <label for="email">
                        <img src="https://cdn-icons-png.flaticon.com/512/542/542638.png" alt="Email" width="20" height="20">
                        Email
                    </label>
                    <input type="email" id="email" name="email" placeholder="Introduce tu email" required>
                </div>

                <div class="input-group">
                    <label for="password">
                        <img src="https://cdn-icons-png.flaticon.com/512/3064/3064197.png" alt="Contraseña" width="20" height="20">
                        Clave de Acceso (ok)
                    </label>
                    <input type="password" id="password" name="password" placeholder="Introduce la clave secreta" required>
                </div>
                
                <button type="submit" class="login-button">
                    <img src="https://cdn-icons-png.flaticon.com/512/1995/1995505.png" alt="Login" width="20" height="20">
                    Iniciar Sesión
                </button>
            </form>

            <!-- Separador -->
            <div class="divider">
                <span>O accede con</span>
            </div>

            <!-- Redes sociales -->
            <div class="social-login">
                <a href="pages/landingpage.html" class="social-btn google-btn" title="Acceder con Google">
                    <img src="https://cdn-icons-png.flaticon.com/512/300/300221.png" alt="Google" width="24" height="24">
                </a>
                <a href="pages/landingpage.html" class="social-btn facebook-btn" title="Acceder con Facebook">
                    <img src="https://cdn-icons-png.flaticon.com/512/733/733547.png" alt="Facebook" width="24" height="24">
                </a>
                <a href="pages/landingpage.html" class="social-btn github-btn" title="Acceder con GitHub">
                    <img src="https://cdn-icons-png.flaticon.com/512/733/733553.png" alt="GitHub" width="24" height="24">
                </a>
            </div>

        </div>
    </section>

    <script src="js/login.js"></script>

</body>
</html>
